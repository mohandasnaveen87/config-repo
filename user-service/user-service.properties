#spring.application.name=user-service
#server.port=8082
# Eureka Client Configuration
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
#spring.datasource.url=jdbc:mysql://localhost:3306/user_db
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/user_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Management and Tracing Configuration
management.tracing.sampling.probability=1.0
#management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.tracing.transport=http
# Optional: Include Trace and Span IDs in your standard application logs
logging.pattern.level=%5p [${spring.application.name}:%X{traceId:-}:%X{spanId:-}]
#management.endpoints.web.exposure.include=health,info,tracing
management.endpoints.web.exposure.include=*
management.observations.http.server.requests.enabled=true
management.tracing.propagation.type=W3C
# Force tracing filters to execute before Spring Security filters
management.tracing.chaining.enabled=true
spring.security.filter.order=100
management.tracing.enabled=true	
management.server.port=8083
management.zipkin.tracing.endpoint=http://host.docker.internal:9411/api/v2/spans